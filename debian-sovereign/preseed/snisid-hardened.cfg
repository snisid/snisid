# SNISID Debian Sovereign Preseed Configuration
# Installation automatisée et durcie selon standards NSA/MLPS

# Locale
d-i debian-installer/locale string fr_HT.UTF-8
d-i console-setup/layoutcode string fr-latin1

# Network (configuration statique pour sécurité)
d-i netcfg/get_hostname string snisid-sovereign
d-i netcfg/get_domain string snisid.ht
d-i netcfg/disable_autoconfig boolean true
d-i netcfg/get_ipaddress string 192.168.100.10
d-i netcfg/get_netmask string 255.255.255.0
d-i netcfg/get_gateway string 192.168.100.1
d-i netcfg/get_nameservers string 192.168.100.1 8.8.8.8
d-i netcfg/confirm_static boolean true

# Mirror settings (miroir local souverain)
d-i mirror/country string manual
d-i mirror/http/hostname string mirror.snisid.ht

# Account setup
d-i passwd/make-user boolean false
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password $6$rounds=4096$SNISIDSalt$$(mkpasswd -m sha-512 -R 4096 'ReplaceWithSecurePassword')

# Clock and time zone setup
d-i clock-setup/utc boolean true
d-i time/zone string America/Port-au-Prince

# Partitioning - LUKS encrypted LVM
d-i partman-auto/method string crypto
d-i partman-auto/disk string /dev/sda
d-i partman-auto/choose_recipe select atomic

# Chiffrement fort
d-i partman-crypto/passphrase string ReplaceWithStrongPassphrase
d-i partman-crypto/passphrase-again string ReplaceWithStrongPassphrase
d-i partman-crypto/algorithm string aes
d-i partman-crypto/keysize string 512
d-i partman-crypto/hash string sha512

# Filesystem options
d-i partman/default_filesystem string ext4
d-i partman-mount/mountpoint_swapfile_boot boolean false

# Write changes to disk
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Package selection - minimal hardened
tasksel tasksel/first multiselect ssh-server, standard
d-i pkgsel/include string dropbear-initramfs apparmor-profiles aide rkhunter chkrootkit fail2ban usbguard tpm2-tools unattended-upgrades auditd
d-i pkgsel/exclude string snapd modemmanager systemd-resolved

# Security updates
d-i pkgsel/install-language-support boolean false
d-i pkgsel/update-policy select unattended-upgrades

# Disable popularity contest (privacy)
popularity-contest popularity-contest/participate boolean false

# GRUB installer
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/sda
d-i grub-installer/password-crypted password $6$rounds=4096$GRUBSalt$$(mkpasswd -m sha-512 -R 4096 'GrubSecurePassword')

# Finish installation
d-i finish-install/reboot_in_progress note

# Post-installation commands
d-i preseed/late_command string \
    cp /cdrom/postinstall/security-hardening.sh /target/usr/local/bin/ && \
    chmod +x /target/usr/local/bin/security-hardening.sh && \
    in-target systemctl enable security-hardening.service && \
    in-target update-initramfs -u
